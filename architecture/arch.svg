<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <marker id="arrow-rev" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#333" />
    </marker>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#f4f6f9" />

  <text x="500" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    Bottling Machine Hardware Architecture
  </text>
  <text x="500" y="80" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d" text-anchor="middle">
    4-Head Counter-Pressure Filler System
  </text>

  <rect x="50" y="250" width="220" height="120" rx="10" fill="#2980b9" filter="url(#shadow)" />
  <text x="160" y="285" font-family="Arial" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">HMI Touchscreen</text>
  <text x="160" y="310" font-family="Arial" font-size="14" fill="#ecf0f1" text-anchor="middle">Waveshare 7" Display</text>
  <text x="160" y="330" font-family="Arial" font-size="14" fill="#ecf0f1" text-anchor="middle">(ESP32-S3 + LVGL)</text>
  <text x="160" y="350" font-family="Arial" font-size="12" font-style="italic" fill="#bdc3c7" text-anchor="middle">Role: UI &amp; Commands</text>

  <line x1="270" y1="310" x2="390" y2="310" stroke="#34495e" stroke-width="4" stroke-dasharray="6,4" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
  <text x="330" y="295" font-family="Arial" font-size="14" font-weight="bold" fill="#2c3e50" text-anchor="middle">UART</text>
  <text x="330" y="330" font-family="Arial" font-size="12" fill="#7f8c8d" text-anchor="middle">TX / RX</text>

  <rect x="400" y="200" width="220" height="220" rx="10" fill="#27ae60" filter="url(#shadow)" />
  <text x="510" y="240" font-family="Arial" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Worker Brain</text>
  <text x="510" y="265" font-family="Arial" font-size="14" fill="#ecf0f1" text-anchor="middle">ESP32-S3 DevKitC</text>
  <text x="510" y="290" font-family="Arial" font-size="12" font-style="italic" fill="#bdc3c7" text-anchor="middle">Role: Logic &amp; Hardware I/O</text>
  
  <rect x="420" y="310" width="180" height="90" rx="5" fill="#2ecc71" />
  <text x="510" y="335" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">State Machine</text>
  <text x="510" y="355" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">1. Indexing -> 2. Lower</text>
  <text x="510" y="370" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">3. Flush -> 4. Fill -> 5. Raise</text>

  <rect x="80" y="480" width="220" height="150" rx="8" fill="#8e44ad" filter="url(#shadow)" />
  <text x="190" y="510" font-family="Arial" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Sensor Inputs</text>
  <text x="190" y="535" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 4x Flow Meters (Interrupts)</text>
  <text x="190" y="560" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 4x Bottle Optical Sensors</text>
  <text x="190" y="585" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 2x Head Limit Switches</text>
  <text x="190" y="610" font-family="Arial" font-size="12" fill="#e8daef" text-anchor="middle">Total: 10 Pins</text>

  <path d="M 300 550 L 450 550 L 450 430" fill="none" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="700" y="150" width="230" height="130" rx="8" fill="#c0392b" filter="url(#shadow)" />
  <text x="815" y="180" font-family="Arial" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Valve Outputs (Relays)</text>
  <text x="815" y="210" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 4x Beer Solenoids</text>
  <text x="815" y="235" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 1x CO2 Master Solenoid</text>
  <text x="815" y="260" font-family="Arial" font-size="12" fill="#fadbd8" text-anchor="middle">Total: 5 Pins</text>

  <line x1="630" y1="215" x2="690" y2="215" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="700" y="320" width="230" height="130" rx="8" fill="#d35400" filter="url(#shadow)" />
  <text x="815" y="350" font-family="Arial" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Mechanical Outputs</text>
  <text x="815" y="380" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 1x Heads Pneumatic Valve</text>
  <text x="815" y="405" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 1x Gate Pneumatic Valve</text>
  <text x="815" y="430" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">• 1x Conveyor Motor Relay</text>

  <line x1="630" y1="385" x2="690" y2="385" stroke="#d35400" stroke-width="3" marker-end="url(#arrow)" />

</svg>